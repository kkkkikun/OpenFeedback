<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}OpenFeedback 管理后台{% endblock %}</title>
{% if csrf_token %}<meta name="csrf-token" content="{{ csrf_token }}">{% endif %}
<link rel="stylesheet" href="/static/admin.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">OF</span>
    <span>OpenFeedback</span>
  </div>
  <div class="topbar-right">
    {% if user %}
      <span class="user-chip">{{ user.username }}</span>
      <a class="btn btn-ghost" href="/admin/logout">退出</a>
    {% endif %}
  </div>
</header>
<main class="page">
{% block content %}{% endblock %}
</main>
<script src="/static/admin.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
