# OpenFeedback deployment.
#
# One API container, one Caddy for TLS, one SQLite file on a named volume.
# A single worker is deliberate: SQLite plus an in-memory rate limiter is
# only correct with one writer.

name: openfeedback

services:
  api:
    build:
      context: ../server
      dockerfile: ../deploy/Dockerfile
      args:
        # Override to point at a registry mirror when Docker Hub is blocked.
        BASE_IMAGE: ${OF_BASE_IMAGE:-python:3.12-slim}
        # Override to point at a PyPI mirror when pypi.org is blocked.
        PIP_INDEX_URL: ${OF_PIP_INDEX_URL:-}
    image: openfeedback-api:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OF_DATA_DIR: /data
      OF_ATTACHMENTS_DIR: /data/attachments
      OF_PORT: "8080"
      OF_ENVIRONMENT: production
      # Caddy is the only thing in front of the app, and it runs in this
      # compose network, so the proxy header is trustworthy here.
      OF_TRUSTED_PROXY_HEADERS: "true"
    volumes:
      - ofdata:/data
    networks:
      - ofnet
    # The API is not published to the host; Caddy reaches it over the
    # internal network only.
    expose:
      - "8080"
    mem_limit: 512m
    cpus: "1.0"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
      args:
        BASE_IMAGE: ${OF_CADDY_BASE_IMAGE:-alpine:3.20}
    image: openfeedback-caddy:latest
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      # The host clients connect to. An IP address works: Let's Encrypt issues
      # short-lived certificates for IP addresses.
      OF_PUBLIC_HOST: ${OF_PUBLIC_HOST:?set the public host}
      # The SNI fallback for clients that connect by IP (they send no SNI).
      # Without it the TLS handshake fails for every IP client.
      OF_DEFAULT_SNI: ${OF_DEFAULT_SNI:-}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The SDK's Maven repository, served read-only at /maven/.
      - ../android-sdk/maven-repo:/srv/maven:ro
      - caddydata:/data
      - caddyconfig:/config
    networks:
      - ofnet
    mem_limit: 128m
    cpus: "0.5"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ofnet:
    driver: bridge

volumes:
  ofdata:
  caddydata:
  caddyconfig:
